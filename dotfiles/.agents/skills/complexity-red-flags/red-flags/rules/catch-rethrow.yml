# A catch whose body is a single throw of a bare identifier — pure rethrow.
# `throw new Error(...)` (wrapping) and `throw e.cause` (re-throwing a sub-
# property) are intentionally excluded. We don't enforce that the thrown
# identifier matches the catch parameter, since the false-positive rate of
# `catch (e) { throw other }` (rare) is low and the LLM audit filters it.
id: catch-rethrow
language: ts
severity: hint
message: catch body is a pure rethrow — try/catch is noise
rule:
  all:
    - kind: catch_clause
    - has:
        kind: statement_block
        has:
          kind: throw_statement
          has:
            kind: identifier
    - not:
        has:
          kind: statement_block
          has:
            any:
              - kind: expression_statement
              - kind: return_statement
              - kind: if_statement
              - kind: variable_declaration
              - kind: lexical_declaration
              - kind: for_statement
              - kind: while_statement
              - kind: try_statement
              - kind: switch_statement
              - kind: do_statement

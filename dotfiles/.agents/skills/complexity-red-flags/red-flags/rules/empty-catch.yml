# A catch clause whose body has no executable statement (truly empty or only
# comments). Comments aren't AST statements, so the `not has any *_statement`
# constraint catches both shapes.
id: empty-catch
language: ts
severity: hint
message: catch body has no executable statement — error is swallowed
rule:
  kind: catch_clause
  not:
    has:
      kind: statement_block
      has:
        any:
          - kind: expression_statement
          - kind: throw_statement
          - kind: return_statement
          - kind: if_statement
          - kind: variable_declaration
          - kind: lexical_declaration
          - kind: for_statement
          - kind: while_statement
          - kind: try_statement
          - kind: switch_statement
          - kind: do_statement
          - kind: break_statement
          - kind: continue_statement
          - kind: labeled_statement

# Method/function body that's exactly one delegating call. Four patterns cover
# the matrix: with-return × without-return (void) × explicit-return-type ×
# implicit-return-type. Single-statement check is implicit in the pattern shape.
id: pass-through-method
language: ts
severity: hint
message: method body is a single delegating call — likely pass-through
rule:
  any:
    - pattern:
        context: 'class X { $NAME($$$_) { return $OBJ.$M($$$_) } }'
        selector: method_definition
    - pattern:
        context: 'class X { $NAME($$$_): $T { return $OBJ.$M($$$_) } }'
        selector: method_definition
    - pattern:
        context: 'class X { $NAME($$$_) { $OBJ.$M($$$_) } }'
        selector: method_definition
    - pattern:
        context: 'class X { $NAME($$$_): $T { $OBJ.$M($$$_) } }'
        selector: method_definition
    - pattern: 'function $NAME($$$_) { return $OBJ.$M($$$_) }'
    - pattern: 'function $NAME($$$_): $T { return $OBJ.$M($$$_) }'
    - pattern: 'function $NAME($$$_) { $OBJ.$M($$$_) }'
    - pattern: 'function $NAME($$$_): $T { $OBJ.$M($$$_) }'

# macOS SMB client settings — deployed to /etc/nsmb.conf by setup.sh.
# Must live in /etc (not ~/Library/Preferences): the global file wins on
# conflict per nsmb.conf(5), and automountd may establish sessions as root.
#
# mc_on=no disables SMB multichannel. The Synology advertises all of its
# interfaces (including unreachable Docker bridges) as extra channels;
# macOS tries them and the session dies, leaving the automounts wedged
# (every op fails EPERM until force-unmounted — see nasfix in .zshrc).
[default]
mc_on=no
